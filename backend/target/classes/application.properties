spring.application.name=festaplanner-backend

# ---------------------------------------------------------------
# MySQL rodando via XAMPP nesta maquina, na porta 3307
# (a 3306 padrao estava ocupada por outro processo).
# ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/festaplanner?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------------------------------------------------------
# H2 em memoria - descomente este bloco (e comente o do MySQL acima)
# se quiser voltar a rodar sem precisar do XAMPP.
# ---------------------------------------------------------------
# spring.datasource.url=jdbc:h2:mem:festaplanner;DB_CLOSE_DELAY=-1
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# JWT
app.jwt.secret=troque-esta-chave-por-uma-bem-longa-e-secreta-em-producao-0123456789
app.jwt.expiration-ms=86400000